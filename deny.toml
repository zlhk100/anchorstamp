# cargo-deny configuration of the workspace. Checked by scripts/check.sh
# (CS-RS-5) with `cargo deny check`.
#
# A dependency that needs a licence not allowed here, or any advisory, is
# a finding to report; this file is not widened to make it pass.

[advisories]
# The default advisory database (RustSec); no advisory is ignored.
# Unmaintained and unsound crates count anywhere in the graph; a yanked
# version is an error.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"

[sources]
# crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
