[package]
name = "anchorstamp-verify"
description = "The reader: validates sightings and joins claims against them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anchorstamp-core = { path = "../anchorstamp-core" }
sha2 = { version = "=0.11.0", default-features = false }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
ecdsa = { version = "=0.17.0", default-features = false }
