[package]
name = "anchorstamp-observe-audit"
description = "The observer: turns kernel audit exec records into chained, unsigned sightings (profile S)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anchorstamp-core = { path = "../anchorstamp-core" }
sha2 = { version = "=0.11.0", default-features = false }
getrandom = "=0.4.3"
libc = "=0.2.191"
rustix = { version = "=1.1.6", default-features = false, features = ["std", "time"] }
